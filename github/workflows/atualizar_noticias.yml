name: Atualizar Noticias Notivibe

on:
  schedule:
    # Executa automaticamente todas as madrugadas às 03:00 AM (Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento para testar

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Executar script de atualização
        run: |
          python update_script.py

      - name: Fazer commit e enviar alterações para o GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automação: Notícias atualizadas dos últimos 3 dias [skip ci]" || exit 0
          git push
